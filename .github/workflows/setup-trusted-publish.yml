name: Setup npm Trusted Publishing

# One-time setup: registers this repository's release workflow as a trusted
# publisher for the package on npm, so `release.yml` can publish with OIDC
# instead of a long-lived token.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'The package name, for example @sanity/sanitype'
        required: true
        default: '@sanity/sanitype'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install
      - run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_PUBLISH_TOKEN }}" > ~/.npmrc
      - run: pnpm dlx setup-npm-trusted-publish@2 ${{ inputs.package }}

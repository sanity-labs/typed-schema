# On every push to main, changesets/action either opens/updates a
# "chore: version packages" PR, or, if that PR was just merged, publishes to
# npm. `changeset publish` detects the pnpm workspace and publishes with
# `pnpm publish`, which authenticates with npm trusted publishing (OIDC) via
# the `npm-publish` GitHub environment registered as the trusted publisher for
# the package on npmjs.com, and attaches provenance automatically.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # to create releases and push the version commit
  id-token: write # to enable use of OIDC for npm trusted publishing
  pull-requests: write # to open the version PR

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm exec changeset version
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

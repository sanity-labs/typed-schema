packages:
  - '.'
  - 'examples/*'
allowBuilds:
  esbuild: false
  # lefthook's postinstall installs the git hooks from lefthook.yml
  lefthook: true

# Only install package versions published at least a day ago (supply-chain
# hygiene); the exclusions below were added when a fresh release was needed.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@sanity/pkg-utils@13.0.8'
  - '@sanity/tsdown-config@0.28.7'
  - '@sanity/vanilla-extract-integration@0.1.25'
  - '@sanity/vanilla-extract-rolldown-plugin@0.4.14'
  - '@sanity/vanilla-extract-tsdown-plugin@0.4.7'
